<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReviewTap</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f7f6;
            font-family: Arial, Helvetica, sans-serif;
            color: #17201b;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 20px;
            text-align: center;
        }

        .logo {
            font-size: 27px;
            font-weight: 700;
        }

        .logo span {
            color: #18a558;
        }

        .main {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 30px 18px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            border: 1px solid #e8ece9;
        }

        .business-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #eaf8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .business-name {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .welcome {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        /* Rating */

        .rating {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
        }

        .star {
            font-size: 38px;
            color: #d1d5db;
            cursor: pointer;
            transition: 0.15s;
        }

        .star.selected {
            color: #f5b301;
        }

        .rating-text {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            margin-top: -20px;
            margin-bottom: 25px;
        }

        /* Options */

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-bottom: 24px;
        }

        .option {
            border: 1px solid #d1d5db;
            background: white;
            border-radius: 20px;
            padding: 10px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option.selected {
            background: #eaf8f0;
            border-color: #18a558;
            color: #137a43;
            font-weight: 600;
        }

        .option:hover {
            border-color: #18a558;
        }

        /* Text */

        textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            border: 1px solid #d1d5db;
            border-radius: 11px;
            padding: 13px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            outline: none;
            margin-bottom: 20px;
        }

        textarea:focus {
            border-color: #18a558;
            box-shadow: 0 0 0 3px rgba(24,165,88,0.10);
        }

        /* Button */

        .generate-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 11px;
            background: #18a558;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #138a49;
        }

        /* Suggestions */

        #suggestions {
            margin-top: 25px;
        }

        .suggestion-card {
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            border-radius: 13px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .suggestion-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .suggestion-text {
            color: #374151;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 13px;
        }

        .copy-btn {
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            background: #17201b;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .google-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #18a558;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .google-btn:hover {
            background: #138a49;
        }

        .loading {
            text-align: center;
            padding: 40px 10px;
            color: #6b7280;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #18a558;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 18px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            text-align: center;
            padding: 35px 10px;
        }

        .error-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .error-title {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .error-text {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            padding: 20px;
        }

        @media (max-width: 600px) {

            .main {
                padding: 22px 14px;
            }

            .card {
                padding: 24px 18px;
            }

            .business-name {
                font-size: 22px;
            }

            .star {
                font-size: 34px;
            }
        }

    </style>

</head>


<body>

<div class="header">

    <div class="logo">
        Review<span>Tap</span>
    </div>

</div>


<div class="main">

    <div class="card" id="content">

        <div class="loading">

            <div class="spinner"></div>

            Loading...

        </div>

    </div>

</div>


<div class="footer">
    Powered by ReviewTap
</div>


<script>


// ==========================================
// GOOGLE APPS SCRIPT API
// ==========================================

const API_URL =
"https://script.google.com/macros/s/AKfycby_ltvYghy_0L4BX-ZJVzwq8f0D0anl5YABLxU2j_cKsOe28YNQhTp0bQnvUw8Ix1_v/exec";


// ==========================================
// GET VENDOR ID
// ==========================================

const urlParams =
    new URLSearchParams(window.location.search);

const vendorId =
    urlParams.get("vendor");

let googleReviewLink = "";

let selectedRating = 0;

let selectedOptions = [];


// ==========================================
// LOAD VENDOR
// ==========================================

async function loadVendor() {

    const content =
        document.getElementById("content");

    if (!vendorId) {

        showError(
            "Invalid QR Code",
            "This ReviewTap QR code does not contain a valid vendor ID."
        );

        return;
    }

    try {

        const response =
            await fetch(
                API_URL +
                "?vendorId=" +
                encodeURIComponent(vendorId)
            );

        const data =
            await response.json();

        if (!data.success) {

            showError(
                "Vendor Not Found",
                "We could not find this business."
            );

            return;
        }

        if (
            data.status &&
            data.status.toString().toLowerCase() !== "active"
        ) {

            showError(
                "QR Code Inactive",
                "This ReviewTap QR code is currently inactive."
            );

            return;
        }

        googleReviewLink =
            data.googleReviewLink;

        showReviewPage(data);

    }

    catch (error) {

        console.error(error);

        showError(
            "Something went wrong",
            "Unable to load this ReviewTap page. Please try again."
        );
    }
}


// ==========================================
// SHOW REVIEW PAGE
// ==========================================

function showReviewPage(data) {

    const content =
        document.getElementById("content");

    content.innerHTML = `

        <div class="business-icon">
            ⭐
        </div>

        <div class="business-name">
            ${escapeHTML(data.vendorName)}
        </div>

        <div class="welcome">

            Thank you for visiting us!<br>
            Tell us about your experience and we'll help you write a review.

        </div>


        <div class="section-title">
            How was your experience?
        </div>


        <div class="rating">

            <span class="star" onclick="selectRating(1)">★</span>
            <span class="star" onclick="selectRating(2)">★</span>
            <span class="star" onclick="selectRating(3)">★</span>
            <span class="star" onclick="selectRating(4)">★</span>
            <span class="star" onclick="selectRating(5)">★</span>

        </div>


        <div class="rating-text" id="ratingText">
            Select your rating
        </div>


        <div class="section-title">
            What did you like?
        </div>


        <div class="options">

            <button class="option"
                onclick="toggleOption(this, 'Product / Service')">
                Product / Service
            </button>

            <button class="option"
                onclick="toggleOption(this, 'Staff')">
                Friendly Staff
            </button>

            <button class="option"
                onclick="toggleOption(this, 'Quality')">
                Good Quality
            </button>

            <button class="option"
                onclick="toggleOption(this, 'Fast Service')">
                Fast Service
            </button>

            <button class="option"
                onclick="toggleOption(this, 'Cleanliness')">
                Cleanliness
            </button>

            <button class="option"
                onclick="toggleOption(this, 'Value for Money')">
                Value for Money
            </button>

        </div>


        <div class="section-title">
            Anything else you'd like to mention?
        </div>


        <textarea
            id="customerComment"
            placeholder="Example: The staff was very helpful and the service was quick..."
        ></textarea>


        <button
            class="generate-btn"
            onclick="generateSuggestions()"
        >
            Generate Review Suggestions
        </button>


        <div id="suggestions"></div>

    `;
}


// ==========================================
// SELECT RATING
// ==========================================

function selectRating(rating) {

    selectedRating = rating;

    const stars =
        document.querySelectorAll(".star");

    stars.forEach(function(star, index) {

        if (index < rating) {

            star.classList.add("selected");

        } else {

            star.classList.remove("selected");

        }

    });


    const ratingText =
        document.getElementById("ratingText");

    const messages = {
        1: "We're sorry your experience wasn't better.",
        2: "Thank you for your feedback.",
        3: "Thank you! We're glad you visited us.",
        4: "Great! We're happy you enjoyed your experience.",
        5: "Excellent! We're glad you loved your experience!"
    };

    ratingText.textContent =
        messages[rating];

}


// ==========================================
// SELECT OPTIONS
// ==========================================

function toggleOption(button, value) {

    button.classList.toggle("selected");

    if (selectedOptions.includes(value)) {

        selectedOptions =
            selectedOptions.filter(
                item => item !== value
            );

    } else {

        selectedOptions.push(value);

    }

}


// ==========================================
// GENERATE REVIEW SUGGESTIONS
// ==========================================

function generateSuggestions() {

    if (selectedRating === 0) {

        alert("Please select your rating first.");

        return;
    }


    const comment =
        document
            .getElementById("customerComment")
            .value
            .trim();


    const vendorName =
        document
            .querySelector(".business-name")
            .textContent;


    const ratingText =
        "⭐".repeat(selectedRating);


    let experience = "";

    if (selectedOptions.length > 0) {

        experience =
            selectedOptions.join(", ");

    } else {

        experience =
            "overall experience";

    }


    let extraText = "";

    if (comment) {

        extraText =
            " " + comment;

    }


    // ======================================
    // CREATE 3 LOCAL SUGGESTIONS
    // ======================================

    const suggestion1 =
        `I had a ${selectedRating >= 4 ? "great" : "good"} experience at ${vendorName}. I really appreciated the ${experience}.${extraText}`;


    const suggestion2 =
        `Really happy with my experience at ${vendorName}. The ${experience} made my visit enjoyable.${extraText} I would definitely recommend them.`;


    const suggestion3 =
        `Had a pleasant experience at ${vendorName}. Everything was good, especially the ${experience}.${extraText} Overall, a very positive experience.`;


    showSuggestions([
        suggestion1,
        suggestion2,
        suggestion3
    ]);

}


// ==========================================
// SHOW SUGGESTIONS
// ==========================================

function showSuggestions(suggestions) {

    const container =
        document.getElementById("suggestions");


    let html = `

        <div class="section-title">
            Choose a review you like
        </div>

    `;


    suggestions.forEach(function(review, index) {

        html += `

            <div class="suggestion-card">

                <div class="suggestion-title">
                    Review Option ${index + 1}
                </div>

                <div class="suggestion-text">
                    ${escapeHTML(review)}
                </div>

                <button
                    class="copy-btn"
                    onclick="copyReview(${index})"
                >
                    Copy Review
                </button>

            </div>

        `;

    });


    html += `

        <button
            class="google-btn"
            onclick="openGoogleReview()"
        >
            ⭐ Write a Google Review
        </button>

    `;


    container.innerHTML = html;


    window.generatedReviews =
        suggestions;


    container.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


// ==========================================
// COPY REVIEW
// ==========================================

function copyReview(index) {

    const review =
        window.generatedReviews[index];


    navigator.clipboard
        .writeText(review)
        .then(function() {

            alert(
                "Review copied! Now open Google Reviews and paste it."
            );

        })
        .catch(function() {

            alert(
                "Unable to copy automatically. Please select the review manually."
            );

        });

}


// ==========================================
// OPEN GOOGLE REVIEW
// ==========================================

function openGoogleReview() {

    if (!googleReviewLink) {

        alert(
            "Google Review link is not available."
        );

        return;
    }


    window.open(
        googleReviewLink,
        "_blank"
    );

}


// ==========================================
// ERROR
// ==========================================

function showError(title, message) {

    document.getElementById("content").innerHTML = `

        <div class="error">

            <div class="error-icon">
                ⚠️
            </div>

            <div class="error-title">
                ${title}
            </div>

            <div class="error-text">
                ${message}
            </div>

        </div>

    `;
}


// ==========================================
// HTML ESCAPE
// ==========================================

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==========================================
// START
// ==========================================

loadVendor();

</script>

</body>

</html>
